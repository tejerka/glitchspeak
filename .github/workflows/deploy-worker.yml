name: Deploy SVG worker to Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "worker"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker

    steps:
      - name: Check secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing — skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An account ID is 32 hex characters: a zone ID, an e-mail or a stray newline fails
          # later with an opaque "Could not route" (code 7003).
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not 32 hex characters (length ${#CLOUDFLARE_ACCOUNT_ID}). Copy it from Workers & Pages → Account ID."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install lib dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Build core
        if: steps.secrets.outputs.ready == 'true'
        run: npm -w core run build

      - name: Install worker dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci
        working-directory: worker

      - name: Test worker
        if: steps.secrets.outputs.ready == 'true'
        run: npm test
        working-directory: worker

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
